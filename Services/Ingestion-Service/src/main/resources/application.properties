spring.application.name=data-ingestion-service
server.port=${SERVER_PORT:8081}
entsoe.api.base-url=https://web-api.tp.entsoe.eu/api
entsoe.api.token=${ENTSOE_API_TOKEN}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always


spring.datasource.url=jdbc:postgresql://localhost:5432/gridpulse
spring.datasource.username=gridpulse
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flway.enabled=true